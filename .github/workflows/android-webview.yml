name: Build ForgeCodex Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-webview/**'
      - '.github/workflows/android-webview.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android-webview
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeCodex-Android-debug
          path: android-webview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
